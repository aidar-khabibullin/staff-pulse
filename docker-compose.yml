services:
  server:
    build:
      context: ./server
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${CLIENT_PORT:-8080}}
      LIVE_UPDATE_INTERVAL_SECONDS: ${LIVE_UPDATE_INTERVAL_SECONDS:-1}
    expose:
      - "4000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
